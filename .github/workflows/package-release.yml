name: Package Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish public npm packages
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+$/u.test(tag)) throw new Error(`Invalid release tag ${tag}`);
          const expected = tag.replace(/^v/u, '');
          const packages = [
            'packages/agent-desktop-core/package.json',
            'packages/dsh-runtime-adapter/package.json',
          ];
          for (const file of packages) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (value.version !== expected) {
              throw new Error(`${file} version ${value.version} does not match tag ${expected}`);
            }
            if (value.private === true) throw new Error(`${file} must be public before release`);
            if (value.publishConfig?.access !== 'public') throw new Error(`${file} must publish with public access`);
            if (value.publishConfig?.registry !== 'https://registry.npmjs.org/') {
              throw new Error(`${file} must publish to registry.npmjs.org`);
            }
          }
          NODE

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Test and build packages
        run: corepack pnpm test

      - name: Verify package contents
        run: |
          set -euo pipefail
          mkdir -p ci-assets
          corepack pnpm --filter @platform/agent-desktop-core pack --pack-destination ci-assets
          corepack pnpm --filter @platform/dsh-runtime-adapter pack --pack-destination ci-assets
          test "$(find ci-assets -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" -eq 2

      - name: Pack packages
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm-pack"
          mkdir -p "$pack_dir"
          corepack pnpm --filter @platform/agent-desktop-core pack --pack-destination "$pack_dir"
          corepack pnpm --filter @platform/dsh-runtime-adapter pack --pack-destination "$pack_dir"
          test "$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" -eq 2

      - name: Publish Core package
        shell: bash
        run: |
          set -euo pipefail
          npm publish "$(find "$RUNNER_TEMP/npm-pack" -maxdepth 1 -type f -name 'platform-agent-desktop-core-*.tgz' -print -quit)" --access public --registry https://registry.npmjs.org

      - name: Publish Runtime Adapter package
        shell: bash
        run: |
          set -euo pipefail
          npm publish "$(find "$RUNNER_TEMP/npm-pack" -maxdepth 1 -type f -name 'platform-dsh-runtime-adapter-*.tgz' -print -quit)" --access public --registry https://registry.npmjs.org
