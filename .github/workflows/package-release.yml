name: Package Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Run package tests
        run: corepack pnpm test

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          node scripts/prepare-package-release.mjs --package-path packages/agent-desktop-core --output-directory release-assets --manifest-name package-manifest-agent-desktop-core.json
          node scripts/prepare-package-release.mjs --package-path packages/dsh-runtime-adapter --output-directory release-assets --manifest-name package-manifest-dsh-runtime-adapter.json
          (cd release-assets && sha256sum *.tgz *.json > SHA256SUMS)

      - name: Upload package assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-release-assets-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish immutable package Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout publisher scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Download package assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-release-assets-${{ github.sha }}
          path: release-assets

      - name: Publish package Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-package-release.mjs release-assets
