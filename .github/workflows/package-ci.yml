name: Package CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and pack Core packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Run package tests
        run: corepack pnpm test

      - name: Verify package packing
        run: |
          set -euo pipefail
          mkdir -p ci-assets
          corepack pnpm --filter @tianbuyv/agent-desktop-core pack --pack-destination ci-assets
          corepack pnpm --filter @tianbuyv/dsh-runtime-adapter pack --pack-destination ci-assets
          test "$(find ci-assets -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')" -ge 2
